<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ninjas - Listagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .ninja-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
        }
        .rank-badge {
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Ninjas Cadastrados</h2>
        <a th:href="@{/ninjas/ui/cadastro}" class="btn btn-success">
            Novo Ninja
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Idade</th>
                    <th>Rank</th>
                    <th>Missão Atual</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ninja : ${ninjas}">
                    <td>
                        <img th:src="${ninja.imgUrl != null ? ninja.imgUrl : 'https://via.placeholder.com/50'}"
                             alt="Ninja" class="ninja-img border">
                    </td>
                    <td th:text="${ninja.nome}" class="fw-bold">Naruto Uzumaki</td>
                    <td th:text="${ninja.email}">naruto@konoha.com</td>
                    <td th:text="${ninja.idade}">17</td>
                    <td>
                        <span class="badge bg-info text-dark rank-badge" th:text="${ninja.rank}">Genin</span>
                    </td>
                    <td>
                        <span th:if="${ninja.missoes != null}" th:text="${ninja.missoes.nome}">Nome da Missão</span>
                        <span th:unless="${ninja.missoes != null}" class="text-muted italic">Sem missão</span>
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/ninjas/ui/editar/{id}(id=${ninja.id})}"
                               class="btn btn-outline-warning">
                                Editar
                            </a>
                            <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}"
                               class="btn btn-outline-danger"
                               onclick="return confirm('Tem certeza que deseja excluir este ninja?')">
                                Excluir
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ninjas)}">
                    <td colspan="7" class="text-center text-muted">Nenhum ninja encontrado no sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
