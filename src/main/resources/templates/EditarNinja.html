<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Ninja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-warning">
                <div class="card-header bg-warning text-dark">
                    <h3 class="mb-0">Editar Ninja: <span th:text="${ninja.nome}"></span></h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/ninjas/ui/atualizar/{id}(id=${ninja.id})}" th:object="${ninja}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Idade</label>
                                <input type="number" th:field="*{idade}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rank</label>
                                <select th:field="*{rank}" class="form-select">
                                    <option value="Genin">Genin</option>
                                    <option value="Chunin">Chunin</option>
                                    <option value="Jonin">Jonin</option>
                                    <option value="Hokage">Hokage</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL da Imagem</label>
                            <input type="url" th:field="*{imgUrl}" class="form-control">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning fw-bold">Salvar Alterações</button>
                            <a th:href="@{/ninjas/ui/listar}" class="btn btn-outline-secondary">Voltar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
